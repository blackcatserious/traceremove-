[project]
name = "compliance"
version = "0.1.0"
description = "Compliance and security orchestration"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "cryptography>=42.0",
    "structlog>=24.2"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
